{% extends "base.html" %}

{% block title %}Change Password - CTF Manager{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="card w-full max-w-md bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl font-bold text-center justify-center mb-4">
                🔐 Change Password
            </h2>
            <p class="text-center text-base-content/70 mb-6">Update your account password</p>
            
            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Current Password</span>
                    </label>
                    <input type="password" name="current_password" placeholder="••••••••" 
                           class="input input-bordered w-full" required />
                </div>
                
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">New Password</span>
                    </label>
                    <input type="password" name="new_password" placeholder="••••••••" 
                           class="input input-bordered w-full" required minlength="6" />
                    <label class="label">
                        <span class="label-text-alt">At least 6 characters</span>
                    </label>
                </div>
                
                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text">Confirm New Password</span>
                    </label>
                    <input type="password" name="confirm_password" placeholder="••••••••" 
                           class="input input-bordered w-full" required minlength="6" />
                </div>
                
                <div class="form-control">
                    <button type="submit" class="btn btn-primary w-full">
                        Change Password
                    </button>
                </div>
            </form>
            
            <div class="divider"></div>
            
            <p class="text-center">
                <a href="{{ url_for('dashboard.index') }}" class="link link-primary">Back to Dashboard</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
